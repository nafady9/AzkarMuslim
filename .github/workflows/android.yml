
name: Build Azkar APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip AzkarMuslim-AndroidStudio.zip -d .

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: AzkarMuslim/AzkarMuslim
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AzkarMuslim-APK
          path: AzkarMuslim/AzkarMuslim/app/build/outputs/apk/debug/app-debug.apk
