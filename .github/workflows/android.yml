
name: Build Azkar Muslim APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get Project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android Project
        run: |
          mkdir -p build-src
          if [ -f AzkarMuslim-fixed-images.zip ]; then
            unzip -o AzkarMuslim-fixed-images.zip -d build-src
          elif [ -f AzkarMuslim-AndroidStudio.zip ]; then
            unzip -o AzkarMuslim-AndroidStudio.zip -d build-src
          elif [ -d AzkarMuslim ]; then
            cp -r AzkarMuslim build-src/
          else
            echo "Android project not found"
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: build-src/AzkarMuslim
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AzkarMuslim-APK
          path: build-src/AzkarMuslim/app/build/outputs/apk/debug/app-debug.apk
