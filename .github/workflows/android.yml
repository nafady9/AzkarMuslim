
name: Build Azkar APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -o AzkarMuslim-AndroidStudio.zip -d .

      - name: Verify project directory
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE/AzkarMuslim"
          test -f "$GITHUB_WORKSPACE/AzkarMuslim/app/build.gradle.kts"

      - name: Fix Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("AzkarMuslim/app/build.gradle.kts")
          s = p.read_text()

          addition = """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """

          if "android {" not in s:
              raise Exception("Android configuration not found")

          s = s.replace("android {", addition, 1)
          p.write_text(s)
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble APK
        working-directory: ${{ github.workspace }}/AzkarMuslim
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AzkarMuslim-APK
          path: AzkarMuslim/app/build/outputs/apk/debug/app-debug.apk
